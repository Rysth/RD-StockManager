services:
  postgres:
    image: postgres:16-alpine
    container_name: rdstock-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-stockmanager_rysthdesign}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rdstock_network

  redis:
    image: redis:7-alpine
    container_name: rdstock-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rdstock_network

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: https://stockmanager-api.rysthdesign.com
    container_name: rdstock-admin
    restart: unless-stopped
    environment:
      - ADMIN_SERVER_NAME=stockmanager.rysthdesign.com
      - API_UPSTREAM_SCHEME=https
      - API_UPSTREAM_HOST=stockmanager-api.rysthdesign.com
      - API_UPSTREAM_PORT=443
    depends_on:
      - api
    networks:
      - rdstock_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`stockmanager.rysthdesign.com`)"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=5173"

  api:
    build: ./backend
    container_name: rdstock-api
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - ADMIN_FRONTEND_URL=https://stockmanager.rysthdesign.com
      - ADMIN_ALLOWED_ORIGINS=https://stockmanager.rysthdesign.com
      - HOSTS_WHITELIST=stockmanager-api.rysthdesign.com
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-stockmanager_rysthdesign}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BUSINESS_NAME=${BUSINESS_NAME:-RysthDesign}
      - BUSINESS_SLOGAN=${BUSINESS_SLOGAN:-Diseño y desarrollo de software}
      - BUSINESS_WHATSAPP=${BUSINESS_WHATSAPP}
      - BUSINESS_EMAIL=${BUSINESS_EMAIL}
      - BUSINESS_LOCATION=${BUSINESS_LOCATION:-Ecuador}
      - BUSINESS_INSTAGRAM=${BUSINESS_INSTAGRAM}
      - BUSINESS_FACEBOOK=${BUSINESS_FACEBOOK}
      - BUSINESS_TIKTOK=${BUSINESS_TIKTOK}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_DOMAIN=${SMTP_DOMAIN:-rysthdesign.com}
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle exec rails db:prepare &&
               bundle exec rails db:seed &&
               bundle exec rails s -p 3000 -b '0.0.0.0'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rdstock_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`stockmanager-api.rysthdesign.com`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  worker:
    build: ./backend
    container_name: rdstock-worker
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-stockmanager_rysthdesign}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ADMIN_FRONTEND_URL=https://stockmanager.rysthdesign.com
      - ADMIN_ALLOWED_ORIGINS=https://stockmanager.rysthdesign.com
      - HOSTS_WHITELIST=stockmanager-api.rysthdesign.com
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_DOMAIN=${SMTP_DOMAIN:-rysthdesign.com}
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
    command: bash -c "bundle exec sidekiq"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rdstock_network

volumes:
  postgres_data:
  redis_data:

networks:
  rdstock_network:
    driver: bridge
