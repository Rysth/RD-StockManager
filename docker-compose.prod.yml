# Production stack — generic template (shared trunk).
#
# Per-client deploys (Dokploy Environment) should set at minimum:
#   APP_DOMAIN, API_DOMAIN, VITE_API_URL,
#   SECRET_KEY_BASE, ADMIN_EMAIL, ADMIN_PASSWORD,
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   BUSINESS_*, SMTP_*, CLOUDFLARE_* (optional)
#
# Postgres and Redis run inside this stack with persistent volumes, so the
# deploy is self-contained. To use an external DB/Redis instead, set
# DATABASE_URL / REDIS_URL and they will override the internal defaults.
services:
  postgres:
    image: postgres:16-alpine
    container_name: rdstock-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-rdstock_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rdstock_network

  redis:
    image: redis:7-alpine
    container_name: rdstock-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rdstock_network

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.example.com}
    container_name: rdstock-admin
    restart: unless-stopped
    environment:
      - ADMIN_SERVER_NAME=${APP_DOMAIN:-admin.example.com}
      - API_UPSTREAM_SCHEME=https
      - API_UPSTREAM_HOST=${API_DOMAIN:-api.example.com}
      - API_UPSTREAM_PORT=443
    depends_on:
      - api
    networks:
      - rdstock_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`${APP_DOMAIN:-admin.example.com}`)"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=5173"

  api:
    build: ./backend
    container_name: rdstock-api
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - ADMIN_FRONTEND_URL=https://${APP_DOMAIN:-admin.example.com}
      - ADMIN_ALLOWED_ORIGINS=https://${APP_DOMAIN:-admin.example.com}
      - HOSTS_WHITELIST=${API_DOMAIN:-api.example.com}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rdstock_production}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BUSINESS_NAME=${BUSINESS_NAME}
      - BUSINESS_SLOGAN=${BUSINESS_SLOGAN}
      - BUSINESS_WHATSAPP=${BUSINESS_WHATSAPP}
      - BUSINESS_EMAIL=${BUSINESS_EMAIL}
      - BUSINESS_LOCATION=${BUSINESS_LOCATION}
      - BUSINESS_INSTAGRAM=${BUSINESS_INSTAGRAM}
      - BUSINESS_FACEBOOK=${BUSINESS_FACEBOOK}
      - BUSINESS_TIKTOK=${BUSINESS_TIKTOK}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle exec rails db:prepare &&
               bundle exec rails db:seed &&
               bundle exec rails s -p 3000 -b '0.0.0.0'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rdstock_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.example.com}`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  worker:
    build: ./backend
    container_name: rdstock-worker
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rdstock_production}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ADMIN_FRONTEND_URL=https://${APP_DOMAIN:-admin.example.com}
      - ADMIN_ALLOWED_ORIGINS=https://${APP_DOMAIN:-admin.example.com}
      - HOSTS_WHITELIST=${API_DOMAIN:-api.example.com}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
    command: bash -c "bundle exec sidekiq"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rdstock_network

volumes:
  postgres_data:
  redis_data:

networks:
  rdstock_network:
    driver: bridge
